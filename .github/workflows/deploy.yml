name: Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 38.47.109.175
          port: 22
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docs/.vitepress/dist/*"
          target: "/var/www/docs"
          strip_components: 3
